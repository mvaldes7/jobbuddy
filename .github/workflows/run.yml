# jobbuddy CI pipeline (private repo): fetch (public ATS APIs) -> hard filter -> embed (local MiniLM)
# -> for 'tailored' applications scoring >= 70: Telegram sendDocument to Mike (listing URL + cover letter PDF)
#    and mark them 'sent_to_user'. jobbuddy NO LONGER fills or submits application forms (no Playwright).
# - Runtime DB access ONLY via DATABASE_URL (pooled, DML-only role jobbuddy_app). No migrations and no
#   DATABASE_URL_DIRECT here: see migrate.yml.
# - No artifacts of any kind: screenshots live in the DB and Mike's private Telegram chat.
# - No-op until the CANDIDATE_PROFILE_JSON and TELEGRAM_BOT_TOKEN secrets exist (guard step).
name: run

on:
  schedule:
    - cron: "47 17 * * *"   # UTC, off the hour
  workflow_dispatch:
    inputs:
      send_app_ids:
        description: "One-off: space-separated application ids to send to Mike now (backfill). Empty = normal run."
        required: false
        default: ""

concurrency:
  group: run-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      # Submission is retired in code; pinned off regardless of any repo variable.
      AUTO_SUBMIT: "false"
      NOTIFIER: telegram
      HEADLESS: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Guard - required secrets present
        id: guard
        run: |
          if [ -z "${CANDIDATE_PROFILE_JSON}" ] || [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "::notice title=jobbuddy run skipped::CANDIDATE_PROFILE_JSON and/or TELEGRAM_BOT_TOKEN secret is not set yet; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Mask candidate profile values in logs
        if: steps.guard.outputs.ready == 'true'
        run: |
          # Registers every top-level string value (and, for safety, every nested string value) of the
          # profile as a log mask. The JSON itself is never echoed; jq errors are suppressed.
          if ! printf '%s' "$CANDIDATE_PROFILE_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::CANDIDATE_PROFILE_JSON is not a JSON object"
            exit 1
          fi
          printf '%s' "$CANDIDATE_PROFILE_JSON" \
            | jq -r '[(.[] | strings), (.. | strings)] | unique | .[] | split("\n")[] | select(length >= 4)' 2>/dev/null \
            | while IFS= read -r v; do
                echo "::add-mask::${v}"
              done

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        if: steps.guard.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ vars.EMBEDDING_MODEL }}

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        if: steps.guard.outputs.ready == 'true' && github.event.inputs.send_app_ids == ''
        run: python -m jobbuddy.cli run-ci

      - name: One-off - send listed apps to Mike (backfill)
        if: steps.guard.outputs.ready == 'true' && github.event.inputs.send_app_ids != ''
        env:
          SEND_APP_IDS: ${{ github.event.inputs.send_app_ids }}
        run: |
          args=""
          for id in $SEND_APP_IDS; do
            case "$id" in (*[!0-9]*|"") echo "::error::bad app id"; exit 1;; esac
            args="$args --app $id"
          done
          python -m jobbuddy.cli send-to-user --backfill $args
